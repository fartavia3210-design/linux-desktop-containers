name: Publish Arch XFCE

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "distros/arch/xfce/**"
      - ".github/workflows/publish-arch-xfce.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Build Arch XFCE image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t ghcr.io/fartavia3210-design/linux-desktop-containers/arch-xfce:latest \
            distros/arch/xfce

      - name: Push Arch XFCE image
        run: |
          docker push \
            ghcr.io/fartavia3210-design/linux-desktop-containers/arch-xfce:latest
